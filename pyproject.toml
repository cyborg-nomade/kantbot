[project]
name = "kantbot"
version = "0.1.0"
description = "An executable philosophical model of Kantian cognition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12,<3",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "hypothesis>=6.167,<7",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["kantbot"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
files = ["src", "typechecks"]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "PL", "SIM", "RUF"]
